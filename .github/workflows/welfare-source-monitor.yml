name: 福利來源異動檢查

on:
  schedule:
    # 每週一台灣時間上午 9:00（UTC 01:00）
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 取得專案
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 檢查官方福利來源
        run: node tools/check-welfare-updates.mjs

      - name: 儲存待審核結果
        run: |
          if git diff --quiet -- data/welfare-source-snapshots.json data/welfare-change-reviews.json dist/welfare-reviews.js; then
            echo "沒有新的監測結果"
            exit 0
          fi
          git config user.name "welfare-monitor[bot]"
          git config user.email "welfare-monitor[bot]@users.noreply.github.com"
          git add data/welfare-source-snapshots.json data/welfare-change-reviews.json dist/welfare-reviews.js
          git commit -m "chore: update welfare source review queue"
          git push

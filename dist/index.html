<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06c755">
  <meta name="description" content="原住民族長者福利行動導航 LINE Bot 互動介面示範。">
  <title>福利行動導航｜LINE Bot 介面模擬</title>
  <link rel="icon" type="image/jpeg" href="./assets/資訊平權ICON.jpg">
  <link rel="stylesheet" href="./styles.css?v=20261004e">
  <script src="./translations.js?v=20260929b" defer></script>
  <script src="./app.js?v=20261004e" defer></script>
</head>
<body>
  <main class="stage">
    <section class="demo-notes" aria-labelledby="demo-title">
      <span class="eyebrow">互動介面提案 · 2026</span>
      <h1 id="demo-title">原住民族長者<br>福利行動導航</h1>
      <p>以「找得到、看得懂、做得到」為主軸，完整模擬福利查詢、申請準備與真人協助三條使用流程。</p>
      <div class="note-box">
        <span class="note-symbol" aria-hidden="true">i</span>
        <span>這是介面與流程原型。福利資格仍以主管機關審核為準，不收集身分證號等敏感資料。</span>
      </div>
      <button class="reset-button" id="reset-desktop" type="button">重新開始對話 <span aria-hidden="true">↗</span></button>
    </section>

    <section class="phone" aria-label="LINE Bot 手機畫面模擬">
      <div class="phone-status" aria-hidden="true"><span>9:41</span><span class="status-icons"><span class="signal">▮▮▮</span><span>◖</span><span class="battery"><span></span></span></span></div>
      <header class="chat-header">
        <button class="header-back" id="back-button" type="button" aria-label="回上一步" title="回上一步" disabled>‹</button>
        <div class="bot-mark" aria-hidden="true"><img src="./assets/資訊平權ICON.jpg" alt=""></div>
        <div class="header-copy"><strong>福利導航</strong><small id="header-language">互動示範 · 非官方服務</small></div>
        <label class="visually-hidden" for="language-select">切換介面語言</label>
        <select class="language-select" id="language-select" aria-label="切換介面語言" data-no-translate>
          <option value="zh">中文</option>
          <option value="ami">阿美語</option>
          <option value="tay">泰雅語</option>
        </select>
        <button class="header-menu" id="reset-mobile" type="button" aria-label="回首頁" title="回首頁">⌂</button>
      </header>
      <div class="accessibility-bar" data-no-translate>
        <label for="font-size-select">字級</label>
        <select id="font-size-select" aria-label="調整字體大小">
          <option value="medium">中</option>
          <option value="large">大</option>
          <option value="xlarge">特大</option>
        </select>
        <button class="read-button" id="read-button" type="button" aria-label="朗讀最新內容">🔊 朗讀</button>
        <span class="speech-note" id="speech-note">也可長按訊息</span>
      </div>
      <div class="demo-ribbon">介面模擬｜請勿輸入個人資料</div>
      <div class="language-hint" id="language-hint" hidden data-no-translate>
        <span id="language-hint-text"></span>
        <a id="language-source" href="#" target="_blank" rel="noopener noreferrer">求助句來源</a>
      </div>
      <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions">
        <div class="date-pill">今天</div>
        <div class="message-row bot">
          <div class="bubble-avatar" aria-hidden="true"><img src="./assets/資訊平權ICON.jpg" alt=""></div>
          <div class="bubble"><strong class="native-greeting" id="welcome-greeting" hidden></strong><strong class="native-question" id="welcome-help-question" hidden></strong><span id="welcome-body">您好，我是福利行動導航。<br><br>可以幫您查福利、整理申請文件，也能找到真人協助。</span><details class="chinese-reference" id="welcome-chinese-reference" hidden data-no-translate><summary>查看中文對照</summary><p>您好，我是福利行動導航。可以幫您查福利、整理申請文件，也能找到真人協助。</p></details></div>
        </div>
      </div>
      <div class="chat-bottom">
        <div class="quick-actions" id="quick-actions" aria-label="建議操作"></div>
        <form class="composer" id="composer" autocomplete="off">
          <button class="plus-button" type="button" aria-label="此功能尚未開放" title="此功能尚未開放">＋</button>
          <label class="visually-hidden" for="message-input">輸入訊息</label>
          <input id="message-input" type="text" inputmode="text" placeholder="輸入問題或點選選單" maxlength="120">
          <button class="send-button" type="submit" aria-label="送出訊息">➤</button>
        </form>
        <nav class="rich-menu" aria-label="主要功能">
          <button type="button" data-action="benefits"><span class="menu-icon" aria-hidden="true">⌕</span><span>找福利</span></button>
          <button type="button" data-action="prepare"><span class="menu-icon" aria-hidden="true">▤</span><span>申請準備</span></button>
          <button type="button" data-action="human"><span class="menu-icon" aria-hidden="true">♧</span><span>真人協助</span></button>
        </nav>
      </div>
      <div class="phone-home" aria-hidden="true"></div>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06c755">
  <meta name="description" content="原住民族長者福利行動導航 LINE Bot 互動介面示範。">
  <title>福利行動導航｜LINE Bot 介面模擬</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2306c755'/%3E%3Cpath d='M14 19h36v23H32l-10 8v-8h-8z' fill='white'/%3E%3Ccircle cx='24' cy='30' r='2.5' fill='%2306c755'/%3E%3Ccircle cx='32' cy='30' r='2.5' fill='%2306c755'/%3E%3Ccircle cx='40' cy='30' r='2.5' fill='%2306c755'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="stage">
    <section class="demo-notes" aria-labelledby="demo-title">
      <span class="eyebrow">互動介面提案 · 2026</span>
      <h1 id="demo-title">原住民族長者<br>福利行動導航</h1>
      <p>試著像使用 LINE 一樣點選下方選單，看看長者、家屬或集會所工作人員如何找到下一步。</p>
      <div class="note-box">
        <span class="note-symbol" aria-hidden="true">i</span>
        <span>這是介面示範，尚未接上 LINE，也沒有正式福利資料或資格判定功能。</span>
      </div>
      <button class="reset-button" id="reset-desktop" type="button">重新開始對話 <span aria-hidden="true">↗</span></button>
    </section>

    <section class="phone" aria-label="LINE Bot 手機畫面模擬">
      <div class="phone-status" aria-hidden="true"><span>9:41</span><span class="status-icons"><span class="signal">▮▮▮</span><span>◖</span><span class="battery"><span></span></span></span></div>
      <header class="chat-header">
        <div class="header-back" aria-hidden="true">‹</div>
        <div class="bot-mark" aria-hidden="true">福</div>
        <div class="header-copy"><strong>福利行動導航</strong><small>互動示範 · 非官方服務</small></div>
        <button class="header-menu" id="reset-mobile" type="button" aria-label="重新開始對話">⋯</button>
      </header>
      <div class="demo-ribbon">介面模擬｜請勿輸入個人資料</div>
      <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions">
        <div class="date-pill">今天</div>
        <div class="message-row bot">
          <div class="bubble-avatar" aria-hidden="true">福</div>
          <div class="bubble">您好，我是福利行動導航示範版。<br><br>想先了解哪一件事？點選下方選單即可開始。</div>
        </div>
      </div>
      <div class="chat-bottom">
        <div class="quick-actions" id="quick-actions" aria-label="建議操作"></div>
        <form class="composer" id="composer" autocomplete="off">
          <button class="plus-button" type="button" aria-label="此功能尚未開放" title="此功能尚未開放">＋</button>
          <label class="visually-hidden" for="message-input">輸入訊息</label>
          <input id="message-input" type="text" inputmode="text" placeholder="輸入問題或點選選單" maxlength="120">
          <button class="send-button" type="submit" aria-label="送出訊息">➤</button>
        </form>
        <nav class="rich-menu" aria-label="主要功能">
          <button type="button" data-action="benefits"><span class="menu-icon" aria-hidden="true">⌕</span><span>福利資訊</span></button>
          <button type="button" data-action="prepare"><span class="menu-icon" aria-hidden="true">▤</span><span>申請準備</span></button>
          <button type="button" data-action="human"><span class="menu-icon" aria-hidden="true">♧</span><span>真人協助</span></button>
        </nav>
      </div>
      <div class="phone-home" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
